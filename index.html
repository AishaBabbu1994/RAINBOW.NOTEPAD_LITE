<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad Lite + Neon Lights ✨</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --win-bg: #f0f0f0;
    --win-border: #a0a0a0;
    --win-btn: linear-gradient(to bottom, #ffffff 0%, #e1e1e1 100%);
    --accent: #0078d7;
    /* Colores de las luces */
    --glow-1: rgba(0, 255, 136, 0.15);
    --glow-2: rgba(136, 68, 255, 0.15);
    --glow-3: rgba(0, 170, 255, 0.15);
  }

  body {
    min-height: 100vh;
    background-color: #0e1217; /* Fondo oscuro para que resalten las luces */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #333;
    padding: 10px;
    overflow: hidden;
  }

  /* --- LUCES DE FONDO (LITE) --- */
  .light-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    width: 40vw;
    height: 40vw;
    border-radius: 50%;
    filter: blur(80px);
    animation: move 20s infinite alternate;
    opacity: 0.6;
  }
  .blob-1 { background: var(--glow-1); top: -10%; left: -10%; }
  .blob-2 { background: var(--glow-2); bottom: -10%; right: -10%; animation-delay: -5s; }
  .blob-3 { background: var(--glow-3); top: 30%; left: 30%; animation-duration: 25s; }

  @keyframes move {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(10%, 10%) scale(1.1); }
  }

  /* --- CONTENEDOR ESTILO AERO --- */
  .container {
    width: min(900px, 98vw);
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid var(--win-border);
    backdrop-filter: blur(10px); /* Efecto Windows 7 Aero */
    box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 0 15px var(--glow-3);
    display: flex;
    flex-direction: column;
    border-radius: 5px;
  }

  .title {
    background: linear-gradient(to bottom, #fcfcfc 0%, #e8e8e8 100%);
    padding: 8px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    border-bottom: 1px solid var(--win-border);
    display: flex;
    justify-content: space-between;
    border-radius: 5px 5px 0 0;
  }

  .toolbar {
    background: #f5f5f5;
    border-bottom: 1px solid #ddd;
    padding: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .tool-group {
    display: flex; gap: 5px; align-items: center;
    padding-right: 8px; border-right: 1px solid #ccc;
  }

  .tool-btn, .tool-select {
    background: var(--win-btn);
    border: 1px solid #adadad;
    border-radius: 3px;
    color: #333; font-size: 0.8rem;
    padding: 4px 10px; cursor: pointer;
    transition: all 0.2s;
  }
  .tool-btn:hover { border-color: var(--accent); box-shadow: 0 0 8px rgba(0,120,215,0.3); }

  /* Botones con luz especial */
  #btnGlow { color: #8844ff; font-weight: bold; }
  #btnGlow:hover { text-shadow: 0 0 5px #8844ff; }

  #editor {
    width: 100%;
    min-height: 450px;
    padding: 30px;
    outline: none;
    font-size: 20px;
    line-height: 1.6;
    background: #fff;
    overflow-y: auto;
  }
  #editor:empty::before { content: attr(data-placeholder); color: #bbb; }

  .status {
    background: #f0f0f0; padding: 5px 12px;
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: #666;
    border-top: 1px solid #ccc;
  }

  .actions {
    display: flex; gap: 10px; justify-content: flex-end;
    padding: 15px 0; width: min(900px, 98vw);
  }

  .action-btn {
    padding: 8px 20px; border-radius: 3px;
    border: 1px solid #adadad; background: var(--win-btn);
    font-size: 0.85rem; cursor: pointer;
    font-weight: 600;
  }
  .btn-save { border-color: #0078d7; background: #e1f5fe; color: #0078d7; }
  .btn-save:hover { background: #0078d7; color: #fff; }

  .toast {
    position: fixed; bottom: 20px; background: #333; color: #fff;
    padding: 10px 20px; border-radius: 4px; opacity: 0;
    transition: opacity 0.3s; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- LUCES AMBIENTALES -->
<div class="light-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="container">
  <div class="title">
    <span>✨ Rainbow Notepad Lite (Neon Edition)</span>
    <span id="fontLabel" style="font-weight:normal; font-size:0.75rem">Fuente: Segoe UI</span>
  </div>
  
  <div class="toolbar">
    <!-- Fuente -->
    <div class="tool-group">
      <button class="tool-btn" id="btnLoadFont" style="background:#e8f5e9">📂 Importar</button>
      <input type="file" id="fontInput" accept=".ttf,.otf,.woff" style="display:none">
      <select id="fontSelector" class="tool-select">
        <option value="'Segoe UI'">Segoe UI</option>
        <option value="Arial">Arial</option>
        <option value="'Courier New'">Courier</option>
        <option value="'Comic Sans MS'">Comic Sans</option>
      </select>
    </div>

    <!-- Luces y Efectos -->
    <div class="tool-group">
      <button class="tool-btn" id="btnRainbow">🌈 Arcoíris</button>
      <button class="tool-btn" id="btnGlow">✨ Brillo</button>
      <button class="tool-btn" id="btnNormal">⬜ Normal</button>
    </div>

    <!-- Colores -->
    <div class="tool-group" id="swatches">
      <div style="width:16px;height:16px;background:#000;cursor:pointer;border:1px solid #888" onclick="setColor('#000')"></div>
      <div style="width:16px;height:16px;background:#ff0080;cursor:pointer;border:1px solid #888" onclick="setColor('#ff0080')"></div>
      <div style="width:16px;height:16px;background:#00aaff;cursor:pointer;border:1px solid #888" onclick="setColor('#00aaff')"></div>
      <div style="width:16px;height:16px;background:#00ff88;cursor:pointer;border:1px solid #888" onclick="setColor('#00ff88')"></div>
    </div>

    <!-- Tamaño -->
    <div class="tool-group">
      <input type="range" id="sizeSlider" min="12" max="60" value="20" style="width:60px">
      <span id="sizeVal" style="font-size:0.8rem; font-weight:bold">20</span>
    </div>
  </div>

  <div id="editor" contenteditable="true" spellcheck="false" data-placeholder="Escribe tu magia aquí..."></div>

  <div class="status">
    <span id="fontInfo">Listo</span>
    <span>
      <span id="charCount">0</span> caracteres | 
      <span id="wordCount">0</span> palabras
    </span>
  </div>
</div>

<div class="actions">
  <button class="action-btn" onclick="copyText()">Copiar</button>
  <button class="action-btn btn-save" onclick="saveFile()">Guardar HTML</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const editor = document.getElementById('editor');
  
  // --- IMPORTAR FUENTE ---
  const fontInput = document.getElementById('fontInput');
  document.getElementById('btnLoadFont').onclick = () => fontInput.click();
  
  fontInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const fontName = 'CustomFont_' + Math.floor(Math.random()*1000);
    const fontData = await file.arrayBuffer();
    const fontFace = new FontFace(fontName, fontData);
    await fontFace.load();
    document.fonts.add(fontFace);
    editor.style.fontFamily = fontName;
    document.getElementById('fontLabel').textContent = "Fuente: " + file.name;
    showToast("Fuente importada: " + file.name);
  };

  // --- EFECTOS DE LUCES (RAINBOW & GLOW) ---
  function applyEffect(type) {
    const sel = window.getSelection();
    if (sel.isCollapsed) { showToast("Selecciona texto primero"); return; }
    const range = sel.getRangeAt(0);
    const text = range.toString();
    const wrapper = document.createElement('span');
    const colors = ['#ff0080', '#ff6600', '#ffdd00', '#00ff88', '#00aaff', '#8844ff'];

    for (let i = 0; i < text.length; i++) {
      const char = document.createElement('span');
      char.textContent = text[i];
      const color = colors[i % colors.length];
      char.style.color = color;
      if (type === 'glow') {
        char.style.textShadow = `0 0 8px ${color}, 0 0 15px ${color}aa`;
        char.style.fontWeight = 'bold';
      }
      wrapper.appendChild(char);
    }
    range.deleteContents();
    range.insertNode(wrapper);
  }

  document.getElementById('btnRainbow').onclick = () => applyEffect('rainbow');
  document.getElementById('btnGlow').onclick = () => applyEffect('glow');
  document.getElementById('btnNormal').onclick = () => {
    document.execCommand('removeFormat');
    document.execCommand('foreColor', false, '#000000');
  };

  // --- UTILIDADES ---
  function setColor(c) { document.execCommand('foreColor', false, c); }

  const sizeSlider = document.getElementById('sizeSlider');
  sizeSlider.oninput = () => {
    editor.style.fontSize = sizeSlider.value + 'px';
    document.getElementById('sizeVal').textContent = sizeSlider.value;
  };

  document.getElementById('fontSelector').onchange = (e) => {
    editor.style.fontFamily = e.target.value;
    document.getElementById('fontLabel').textContent = "Fuente: " + e.target.value;
  };

  editor.oninput = () => {
    const text = editor.innerText;
    document.getElementById('charCount').textContent = text.length;
    document.getElementById('wordCount').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
  };

  function showToast(m) {
    const t = document.getElementById('toast');
    t.textContent = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function copyText() {
    navigator.clipboard.writeText(editor.innerText);
    showToast("¡Texto copiado!");
  }

  function saveFile() {
    const html = `<html><body style="background:#0e1217;color:white;font-family:sans-serif;padding:50px">${editor.innerHTML}</body></html>`;
    const blob = new Blob([html], {type:'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mi_nota_magica.html';
    a.click();
  }
</script>
</body>
</html>
