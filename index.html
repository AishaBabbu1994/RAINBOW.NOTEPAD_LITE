<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad Lite - Legacy Edition ✨</title>
<style>
  /* Reset básico */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --win-border: #8e8f91;
    --win-btn: linear-gradient(to bottom, #fcfcfc 0%, #e1e1e1 100%);
    --accent: #0078d7;
  }

  body {
    min-height: 100vh;
    /* Gradiente estático que imita luces sin consumir CPU */
    background: #0e1217 radial-gradient(circle at 0% 0%, rgba(0, 255, 136, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(136, 68, 255, 0.1) 0%, transparent 40%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    padding: 10px;
  }

  /* Contenedor optimizado (Sin Blur) */
  .container {
    width: min(900px, 98vw);
    background: #ffffff; /* Sólido para máximo rendimiento */
    border: 1px solid var(--win-border);
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    border-radius: 4px;
  }

  /* Cabecera estilo Windows 7 */
  .title {
    background: linear-gradient(to bottom, #ebf2f9 0%, #d0def0 100%);
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #1e395b;
    border-bottom: 1px solid #91a7c4;
    display: flex;
    justify-content: space-between;
    border-radius: 4px 4px 0 0;
  }

  /* Barra de herramientas */
  .toolbar {
    background: #f0f0f0;
    border-bottom: 1px solid #d1d1d1;
    padding: 5px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tool-group {
    display: flex; gap: 4px; align-items: center;
    padding-right: 6px; border-right: 1px solid #ccc;
  }
  .tool-group:last-child { border-right: none; }

  .tool-btn, .tool-select {
    background: var(--win-btn);
    border: 1px solid #adadad;
    border-radius: 2px;
    color: #333; font-size: 0.75rem;
    padding: 3px 8px; cursor: pointer;
  }
  .tool-btn:hover { border-color: #7eb4ea; background: #e5f1fb; }

  /* Editor de alto rendimiento */
  #editor {
    width: 100%;
    min-height: 400px;
    padding: 20px;
    outline: none;
    font-size: 18px;
    line-height: 1.5;
    background: #ffffff;
    overflow-y: auto;
    color: #000;
  }
  #editor:empty::before { content: attr(data-placeholder); color: #999; }

  /* Efectos visuales de texto (Sin filtros pesados) */
  .glow-text {
    text-shadow: 0 0 3px currentColor; /* Sombra ligera para PCs viejas */
    font-weight: bold;
  }

  .status {
    background: #f0f0f0; padding: 3px 10px;
    display: flex; justify-content: space-between;
    font-size: 0.7rem; color: #666;
    border-top: 1px solid #ccc;
  }

  .actions {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 10px 0; width: min(900px, 98vw);
  }

  .action-btn {
    padding: 5px 15px; border-radius: 2px;
    border: 1px solid #adadad; background: var(--win-btn);
    font-size: 0.8rem; cursor: pointer;
  }
  .btn-save { font-weight: bold; border-color: var(--accent); color: #005a9e; }

  .toast {
    position: fixed; bottom: 20px; background: #333; color: #fff;
    padding: 6px 15px; border-radius: 2px; opacity: 0;
    transition: opacity 0.2s; z-index: 100; font-size: 0.8rem;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">
  <div class="title">
    <span>✨ Rainbow Notepad Lite</span>
    <span id="fontLabel" style="font-weight:normal; font-size:0.7rem">Segoe UI</span>
  </div>
  
  <div class="toolbar">
    <!-- Fuente -->
    <div class="tool-group">
      <button class="tool-btn" id="btnLoadFont">📂 Abrir Fuente</button>
      <input type="file" id="fontInput" accept=".ttf,.otf,.woff" style="display:none">
      <select id="fontSelector" class="tool-select">
        <option value="'Segoe UI'">Segoe UI</option>
        <option value="Arial">Arial</option>
        <option value="'Courier New'">Courier</option>
        <option value="'Comic Sans MS'">Comic Sans</option>
      </select>
    </div>

    <!-- Efectos -->
    <div class="tool-group">
      <button class="tool-btn" id="btnRainbow">🌈 Arcoíris</button>
      <button class="tool-btn" id="btnGlow">✨ Brillo</button>
      <button class="tool-btn" id="btnNormal">⬜ Normal</button>
    </div>

    <!-- Colores rápidos -->
    <div class="tool-group">
      <button class="tool-btn" style="color:#d32f2f" onclick="setColor('#d32f2f')">■</button>
      <button class="tool-btn" style="color:#388e3c" onclick="setColor('#388e3c')">■</button>
      <button class="tool-btn" style="color:#1976d2" onclick="setColor('#1976d2')">■</button>
      <button class="tool-btn" style="color:#000" onclick="setColor('#000')">■</button>
    </div>

    <!-- Tamaño -->
    <div class="tool-group">
      <input type="range" id="sizeSlider" min="12" max="50" value="18" style="width:50px">
      <span id="sizeVal" style="font-size:0.75rem; font-weight:bold">18</span>
    </div>
  </div>

  <div id="editor" contenteditable="true" spellcheck="false" data-placeholder="Escribe aquí..."></div>

  <div class="status">
    <span id="fontInfo">Sistema listo</span>
    <span><span id="charCount">0</span> caracteres</span>
  </div>
</div>

<div class="actions">
  <button class="action-btn" onclick="copyText()">Copiar</button>
  <button class="action-btn btn-save" onclick="saveFile()">Guardar HTML</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const editor = document.getElementById('editor');
  
  // --- IMPORTAR FUENTE ---
  const fontInput = document.getElementById('fontInput');
  document.getElementById('btnLoadFont').onclick = () => fontInput.click();
  
  fontInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const fontName = 'CustomFont_' + Date.now();
      const fontData = await file.arrayBuffer();
      const fontFace = new FontFace(fontName, fontData);
      await fontFace.load();
      document.fonts.add(fontFace);
      editor.style.fontFamily = fontName;
      document.getElementById('fontLabel').textContent = file.name;
      showToast("Fuente cargada");
    } catch(err) { showToast("Error de fuente"); }
  };

  // --- EFECTOS (Optimizado para PC Vieja) ---
  function applyEffect(type) {
    const sel = window.getSelection();
    if (sel.isCollapsed) return;
    const range = sel.getRangeAt(0);
    const text = range.toString();
    const fragment = document.createDocumentFragment();
    const colors = ['#e91e63', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];

    for (let i = 0; i < text.length; i++) {
      const char = document.createElement('span');
      char.textContent = text[i];
      const color = colors[i % colors.length];
      char.style.color = color;
      if (type === 'glow') {
        char.className = 'glow-text';
      }
      fragment.appendChild(char);
    }
    range.deleteContents();
    range.insertNode(fragment);
  }

  document.getElementById('btnRainbow').onclick = () => applyEffect('rainbow');
  document.getElementById('btnGlow').onclick = () => applyEffect('glow');
  document.getElementById('btnNormal').onclick = () => {
    document.execCommand('removeFormat');
    document.execCommand('foreColor', false, '#000000');
  };

  // --- UTILIDADES ---
  function setColor(c) { document.execCommand('foreColor', false, c); }

  document.getElementById('sizeSlider').oninput = (e) => {
    editor.style.fontSize = e.target.value + 'px';
    document.getElementById('sizeVal').textContent = e.target.value;
  };

  document.getElementById('fontSelector').onchange = (e) => {
    editor.style.fontFamily = e.target.value;
    document.getElementById('fontLabel').textContent = e.target.value;
  };

  editor.oninput = () => {
    document.getElementById('charCount').textContent = editor.innerText.length;
  };

  function showToast(m) {
    const t = document.getElementById('toast');
    t.textContent = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  }

  function copyText() {
    navigator.clipboard.writeText(editor.innerText);
    showToast("¡Copiado!");
  }

  function saveFile() {
    const html = `<!DOCTYPE html><html><body style="padding:40px;font-family:sans-serif">${editor.innerHTML}</body></html>`;
    const blob = new Blob([html], {type:'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nota.html';
    a.click();
  }
</script>
</body>
</html>
