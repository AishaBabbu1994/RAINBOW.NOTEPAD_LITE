<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad Ultra-Lite ✨</title>
<style>
  /* RESET TOTAL PARA RENDIMIENTO */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #1a1a1a; /* Color sólido, sin luces de fondo pesadas */
    font-family: Tahoma, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    color: #333;
  }

  /* CONTENEDOR PLANO (SIN SOMBRAS NI TRANSPARENCIAS) */
  .container {
    width: 100%;
    max-width: 850px;
    background: #ffffff;
    border: 2px solid #555;
    display: flex;
    flex-direction: column;
  }

  /* CABECERA ESTILO CLÁSICO */
  .title-bar {
    background: #005a9e;
    color: white;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
  }

  /* BARRA DE HERRAMIENTAS PLANA */
  .toolbar {
    background: #f0f0f0;
    border-bottom: 1px solid #999;
    padding: 5px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .group {
    display: flex;
    align-items: center;
    gap: 3px;
    padding-right: 5px;
    border-right: 1px solid #ccc;
  }

  /* BOTONES ESTILO WINDOWS CLÁSICO */
  button, select {
    background: #e1e1e1;
    border: 1px solid #777;
    padding: 3px 6px;
    font-size: 11px;
    cursor: pointer;
    font-family: Tahoma, sans-serif;
  }
  button:hover { background: #d1d1d1; border-color: #333; }
  button:active { background: #bbb; }

  /* COLORES SÓLIDOS */
  .color-btn {
    width: 20px;
    height: 20px;
    border: 1px solid #333;
    cursor: pointer;
    padding: 0;
  }

  /* EDITOR DE TEXTO (OPTIMIZADO) */
  #editor {
    width: 100%;
    min-height: 400px;
    padding: 15px;
    outline: none;
    font-size: 18px;
    line-height: 1.4;
    background: #fff;
    overflow-y: auto;
    word-wrap: break-word;
  }
  #editor:empty::before { content: "Escribe aquí..."; color: #aaa; }

  /* ESTADO */
  .status-bar {
    background: #f0f0f0;
    border-top: 1px solid #999;
    padding: 2px 10px;
    font-size: 11px;
    color: #555;
    display: flex;
    justify-content: space-between;
  }

  /* BOTONES DE ACCIÓN */
  .footer-actions {
    margin-top: 10px;
    display: flex;
    gap: 10px;
  }

  .btn-main {
    padding: 8px 15px;
    font-weight: bold;
    border: 2px solid #555;
  }

  /* ESTILO PARA EL EFECTO BRILLO (MUY LIGERO) */
  .glow { font-weight: bold; text-shadow: 1px 1px 2px #aaa; }
</style>
</head>
<body>

<div class="container">
  <div class="title-bar">
    <span>📝 NOTEPAD ULTRA-LITE</span>
    <span id="fontDisplay">Segoe UI</span>
  </div>

  <div class="toolbar">
    <!-- FUENTES -->
    <div class="group">
      <button onclick="document.getElementById('fileIn').click()">📂 Abrir Fuente</button>
      <input type="file" id="fileIn" accept=".ttf,.otf" style="display:none" onchange="importFont(this)">
      <select id="fontSelect" onchange="changeFont(this.value)">
        <option value="Tahoma">Tahoma</option>
        <option value="Arial">Arial</option>
        <option value="'Courier New'">Courier</option>
        <option value="'Times New Roman'">Times</option>
      </select>
    </div>

    <!-- TAMAÑO -->
    <div class="group">
      <span style="font-size:10px">Tamaño:</span>
      <select onchange="changeSize(this.value)">
        <option value="3">Pequeño</option>
        <option value="4">Normal</option>
        <option value="5" selected>Grande</option>
        <option value="6">Extra</option>
        <option value="7">Título</option>
      </select>
    </div>

    <!-- COLORES (CORREGIDOS) -->
    <div class="group">
      <button class="color-btn" style="background:#000" title="Negro" onclick="applyColor('#000000')"></button>
      <button class="color-btn" style="background:#ff0000" title="Rojo" onclick="applyColor('#ff0000')"></button>
      <button class="color-btn" style="background:#008000" title="Verde" onclick="applyColor('#008000')"></button>
      <button class="color-btn" style="background:#0000ff" title="Azul" onclick="applyColor('#0000ff')"></button>
    </div>

    <!-- EFECTOS ESPECIALES -->
    <div class="group">
      <button onclick="applyRainbow()">🌈 Arcoíris</button>
      <button onclick="applyGlow()">✨ Brillo</button>
      <button onclick="clearFormat()">⬜ Limpiar</button>
    </div>
  </div>

  <div id="editor" contenteditable="true" spellcheck="false"></div>

  <div class="status-bar">
    <span id="count">0 caracteres</span>
    <span>Ready</span>
  </div>
</div>

<div class="footer-actions">
  <button class="btn-main" onclick="copyAll()">COPIAR</button>
  <button class="btn-main" onclick="saveHTML()" style="background:#005a9e; color:white">GUARDAR</button>
</div>

<script>
  const editor = document.getElementById('editor');

  // Asegurar que el editor tenga el foco para que los colores funcionen
  function applyColor(color) {
    editor.focus();
    document.execCommand('foreColor', false, color);
  }

  function changeSize(size) {
    editor.focus();
    document.execCommand('fontSize', false, size);
  }

  function changeFont(font) {
    editor.style.fontFamily = font;
    document.getElementById('fontDisplay').textContent = font;
  }

  function clearFormat() {
    editor.focus();
    document.execCommand('removeFormat', false, null);
    document.execCommand('foreColor', false, '#000000');
  }

  // Importar fuente externa
  async function importFont(input) {
    const file = input.files[0];
    if (!file) return;
    const fontName = 'CustomFont';
    const data = await file.arrayBuffer();
    const font = new FontFace(fontName, data);
    await font.load();
    document.fonts.add(font);
    editor.style.fontFamily = fontName;
    document.getElementById('fontDisplay').textContent = file.name;
  }

  // Efecto Arcoíris (Procesamiento simple)
  function applyRainbow() {
    const sel = window.getSelection();
    if (sel.isCollapsed) return;
    const text = sel.toString();
    const colors = ['#ff0000', '#ff8000', '#00aa00', '#0000ff', '#8000ff'];
    let html = '';
    for (let i = 0; i < text.length; i++) {
      html += `<span style="color:${colors[i % colors.length]}">${text[i]}</span>`;
    }
    document.execCommand('insertHTML', false, html);
  }

  // Efecto Brillo (Ligero)
  function applyGlow() {
    const sel = window.getSelection();
    if (sel.isCollapsed) return;
    const html = `<span class="glow" style="color:#ff0080">${sel.toString()}</span>`;
    document.execCommand('insertHTML', false, html);
  }

  // Contador de caracteres
  editor.addEventListener('input', () => {
    document.getElementById('count').textContent = editor.innerText.length + " caracteres";
  });

  function copyAll() {
    const range = document.createRange();
    range.selectNode(editor);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
    alert("¡Copiado!");
  }

  function saveHTML() {
    const content = `<html><body style="font-family:sans-serif; padding:20px;">${editor.innerHTML}</body></html>`;
    const blob = new Blob([content], {type: 'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nota.html';
    a.click();
  }
</script>

</body>
</html>
